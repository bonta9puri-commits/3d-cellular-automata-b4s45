<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🔬 3D CA 対消滅（完全ゼロ化）物理実験室</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050811;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; }
    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(11, 17, 28, 0.95);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 18px 24px;
      max-width: 540px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      z-index: 10;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 12px;
      background: rgba(248, 81, 73, 0.25);
      color: #ff7b72;
      border: 1px solid rgba(248, 81, 73, 0.6);
    }
    .desc-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 12px;
      margin: 10px 0;
      font-size: 13px;
      line-height: 1.5;
      color: #e6edf3;
    }
    .stat-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .stat-card {
      flex: 1;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-val { font-size: 22px; font-weight: bold; font-family: monospace; color: #58a6ff; }
    .stat-lbl { font-size: 11px; color: #8b949e; text-transform: uppercase; }
    .val-zero { color: #f85149 !important; text-shadow: 0 0 10px rgba(248,81,73,0.7); }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    button.ctrl-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button.ctrl-btn:hover { background: #30363d; }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #8b949e;
    }
    input[type=range] { flex: 1; accent-color: #58a6ff; }
    .legend {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #21262d;
      font-size: 11.5px;
      color: #8b949e;
      line-height: 1.6;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-panel">
    <h1>🔬 3D 正面衝突「完全ゼロ化」物理検証 <span class="badge">純度100%</span></h1>
    <div style="font-size: 12px; color: #8b949e;">
      外部チートや消去コードを一切含まない、純粋な B4/S45 ルールのみによる実測データです。
    </div>

    <div class="stat-row" style="margin-top: 10px;">
      <div class="stat-card">
        <div class="stat-lbl">経過ステップ</div>
        <div id="step-lbl" class="stat-val">t = 0</div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">空間総セル数</div>
        <div id="count-lbl" class="stat-val">14</div>
      </div>
    </div>

    <div id="desc-box" class="desc-box">
      準備中...
    </div>

    <div class="controls">
      <button id="play-btn" class="ctrl-btn" onclick="togglePlay()">⏸ 一時停止</button>
      <button class="ctrl-btn" onclick="prevStep()">◀ 1コマ戻る</button>
      <button class="ctrl-btn" onclick="nextStep()">1コマ進む ▶</button>
      <button class="ctrl-btn" onclick="resetSim()">↺ 最初から</button>
    </div>

    <div class="slider-row">
      <span>Step: <span id="time-val">0</span> / 9</span>
      <input type="range" id="time-slider" min="0" max="9" value="0" oninput="onSlider(this.value)">
    </div>

    <div class="legend">
      💡 <strong>完全対消滅が起きるメカニズム</strong>:<br>
      ・<strong>t=5〜6</strong>: 正面衝突で密集し、中心セルの周囲が6個以上になり「過密死（即死）」<br>
      ・<strong>t=7〜8</strong>: 中心が消えたことで外殻セルの周囲が3個以下になり「過疎死（連鎖死）」<br>
      ・<strong>t=9</strong>: 新規誕生条件「近傍ちょうど4」を満たす隙間がゼロとなり、<strong>完全に 0 セル消滅</strong>！
    </div>
  </div>

  <script>
    const FRAMES = [{"t":0,"cells":[[0,0,0],[0,2,0],[0,1,0],[0,1,1],[1,0,1],[1,2,1],[1,1,1],[0,0,7],[0,2,7],[0,1,7],[0,1,6],[-1,0,6],[-1,2,6],[-1,1,6]],"count":14,"desc":"発射直後: 2発の7セル弾（青と赤、計14セル）が互いに接近開始"},{"t":1,"cells":[[-1,1,0],[-1,1,1],[1,0,1],[1,2,1],[0,0,0],[0,2,0],[0,1,2],[1,1,2],[-1,0,6],[1,1,6],[1,1,7],[-1,2,6],[0,0,7],[0,2,7],[-1,1,5],[0,1,5]],"count":16,"desc":"t=1: 互いに波打ちながら接近中 (16セル)"},{"t":2,"cells":[[-1,0,1],[-1,1,1],[-1,2,1],[0,0,2],[0,1,2],[0,2,2],[1,1,0],[-1,1,7],[0,0,5],[0,1,5],[0,2,5],[1,0,6],[1,2,6],[1,1,6]],"count":14,"desc":"t=2: 周期変化で14セルへ"},{"t":3,"cells":[[-1,0,2],[-1,1,1],[0,1,0],[0,1,2],[-1,2,2],[1,1,1],[-1,1,6],[0,1,7],[0,1,5],[1,0,5],[1,1,6],[1,2,5]],"count":12,"desc":"t=3: 12セルに収縮しながら超至近距離へ"},{"t":4,"cells":[[-1,0,1],[-1,1,1],[-1,1,2],[0,0,2],[0,1,2],[-1,2,1],[0,2,2],[0,0,5],[0,1,5],[0,2,5],[1,0,6],[1,1,6],[1,2,6],[1,1,5]],"count":14,"desc":"t=4: 衝突直前: 互いの近傍圏に突入 (14セル)"},{"t":5,"cells":[[-2,1,1],[-2,1,2],[0,0,2],[-1,0,1],[-1,2,1],[0,2,2],[-1,1,3],[0,1,3],[0,1,4],[1,0,6],[1,1,4],[0,0,5],[0,2,5],[1,2,6],[2,1,5],[2,1,6]],"count":16,"desc":"t=5: 激突開始! 前頭部が重なり合い過密域を形成 (16セル)"},{"t":6,"cells":[[-2,0,2],[-2,1,2],[-2,2,2],[-1,1,3],[0,1,1],[0,1,3],[1,0,3],[1,2,3],[-1,0,4],[-1,2,4],[0,1,4],[1,1,4],[0,1,6],[2,0,5],[2,1,5],[2,2,5]],"count":16,"desc":"t=6: 中心部が過密死(6近傍以上)で崩壊開始 (16セル)"},{"t":7,"cells":[[-2,0,3],[-1,1,1],[-2,2,3],[0,0,2],[0,2,2],[1,1,2],[2,0,4],[2,2,4],[-1,1,5],[0,0,5],[0,2,5],[1,1,6]],"count":12,"desc":"t=7: 中心が死に、外殻が取り残される (12セル)"},{"t":8,"cells":[[-1,1,3],[0,1,1],[0,1,2],[1,1,4],[0,1,5],[0,1,6]],"count":6,"desc":"t=8: 外殻の仲間が過疎死(3近傍以下)で次々に脱落 (6セル)"},{"t":9,"cells":[],"count":0,"desc":"t=9: ★完全対消滅達成! 生存セル 0（空間の完全な無）!"}];
    let stepIndex = 0;
    let isPlaying = false; // 初期状態は1コマずつ見られるよう停止

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 10, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 3.5);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(20, 20, 0x30363d, 0x161b22);
    grid.position.set(0, -1, 3.5);
    scene.add(grid);

    const boxGroup = new THREE.Group();
    scene.add(boxGroup);

    const boxGeom = new THREE.BoxGeometry(0.88, 0.88, 0.88);

    const matBlue = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.8, emissive: 0x38bdf8, emissiveIntensity: 0.3 });
    const matRed = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.2, metalness: 0.8, emissive: 0xf43f5e, emissiveIntensity: 0.3 });
    const matSpark = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.1, metalness: 0.9, emissive: 0xfacc15, emissiveIntensity: 0.6 });

    function renderStep() {
      while (boxGroup.children.length > 0) {
        boxGroup.remove(boxGroup.children[0]);
      }

      const frame = FRAMES[stepIndex];
      document.getElementById('step-lbl').innerText = 't = ' + frame.t;
      const countEl = document.getElementById('count-lbl');
      countEl.innerText = frame.count;
      if (frame.count === 0) {
        countEl.className = 'stat-val val-zero';
        countEl.innerText = '0 (完全消滅)';
      } else {
        countEl.className = 'stat-val';
      }

      document.getElementById('desc-box').innerText = frame.desc;
      document.getElementById('time-val').innerText = stepIndex;
      document.getElementById('time-slider').value = stepIndex;

      frame.cells.forEach(([x, y, z]) => {
        let mat = matBlue;
        if (stepIndex === 0) {
          mat = z < 3 ? matBlue : matRed;
        } else if (stepIndex >= 5 && stepIndex <= 7) {
          mat = matSpark;
        } else {
          mat = z < 3.5 ? matBlue : matRed;
        }
        const mesh = new THREE.Mesh(boxGeom, mat);
        mesh.position.set(x, y, z);
        boxGroup.add(mesh);
      });
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('play-btn').innerText = isPlaying ? '⏸ 一時停止' : '▶ 再生';
    }

    function prevStep() {
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶ 再生';
      stepIndex = Math.max(0, stepIndex - 1);
      renderStep();
    }

    function nextStep() {
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶ 再生';
      stepIndex = Math.min(9, stepIndex + 1);
      renderStep();
    }

    function resetSim() {
      stepIndex = 0;
      renderStep();
    }

    function onSlider(v) {
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶ 再生';
      stepIndex = parseInt(v);
      renderStep();
    }

    let lastTime = 0;
    function animate(time) {
      requestAnimationFrame(animate);
      controls.update();

      if (isPlaying && time - lastTime > 600) {
        lastTime = time;
        if (stepIndex < 9) {
          stepIndex++;
          renderStep();
        } else {
          isPlaying = false;
          document.getElementById('play-btn').innerText = '▶ 再生';
        }
      }

      renderer.render(scene, camera);
    }

    renderStep();
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
