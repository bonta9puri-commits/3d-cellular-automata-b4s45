<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🌌 3D 完全自立型 CA コンピュータ 【究極・純度100%完全実証版】</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050811;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; }
    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(11, 17, 28, 0.95);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 18px 24px;
      max-width: 530px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      z-index: 10;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 12px;
      background: rgba(163, 230, 53, 0.25);
      color: #a3e635;
      border: 1px solid rgba(163, 230, 53, 0.6);
    }
    .desc {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .pipeline-container {
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .pipe-title {
      font-size: 10.5px;
      color: #8b949e;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .pipe-steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      font-size: 10.5px;
      text-align: center;
    }
    .pipe-step {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 6px 2px;
      color: #6e7681;
      transition: all 0.2s;
    }
    .pipe-step.active {
      background: #1f6feb;
      border-color: #58a6ff;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.6);
    }
    .pipe-step.done {
      background: rgba(63, 185, 80, 0.15);
      border-color: #3fb950;
      color: #3fb950;
    }
    .monitor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .monitor-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: center;
    }
    .m-label { font-size: 10.5px; color: #8b949e; text-transform: uppercase; }
    .m-val { font-size: 19px; font-weight: 800; font-family: monospace; }
    .val-calc { color: #f0883e; }
    .val-mem { color: #a3e635; text-shadow: 0 0 10px rgba(163, 230, 53, 0.6); }
    .val-off { color: #484f58; }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    button.ctrl-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button.ctrl-btn:hover { background: #30363d; }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }
    input[type=range] { flex: 1; accent-color: #58a6ff; }
    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 11px;
      padding-top: 8px;
      border-top: 1px solid #21262d;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 2px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-panel">
    <h1>🌌 3D CA 計算機 <span class="badge">純度100% 完全実証版</span></h1>
    <div class="desc">
      すり抜けもピンボール補間もCGの飾り箱も一切ゼロ！<br>
      <strong>自立砲台発射 ➔ 正面衝突加算 ➔ アタッチメント結晶化記憶 ➔ RESET完全対消滅</strong> の全生涯完全統合！
    </div>

    <div class="pipeline-container">
      <div class="pipe-title">計算機パイプライン実行工程</div>
      <div class="pipe-steps">
        <div id="p-fire" class="pipe-step active">① 発射</div>
        <div id="p-calc" class="pipe-step">② 演算</div>
        <div id="p-store" class="pipe-step">③ 結晶化</div>
        <div id="p-reset" class="pipe-step">④ 消去</div>
        <div id="p-done" class="pipe-step">⑤ 完遂</div>
      </div>
    </div>

    <div class="monitor-grid">
      <div class="monitor-card">
        <span class="m-label">半加算器 (1+1)</span>
        <span id="stat-calc" class="m-val val-off">待機中</span>
      </div>
      <div class="monitor-card">
        <span class="m-label">メモリ (Qビット)</span>
        <span id="stat-mem" class="m-val val-off">Q = 0</span>
      </div>
    </div>

    <div class="controls">
      <button id="play-btn" class="ctrl-btn" onclick="togglePlay()">⏸ 一時停止</button>
      <button class="ctrl-btn" onclick="prevStep()">◀</button>
      <button class="ctrl-btn" onclick="nextStep()">▶</button>
      <button class="ctrl-btn" onclick="resetSim()">↺ 最初から</button>
    </div>

    <div class="slider-row">
      <span>Step: <span id="time-val">0</span> / 80</span>
      <input type="range" id="time-slider" min="0" max="80" value="0" oninput="onSlider(this.value)">
    </div>

    <div class="legend">
      <div class="legend-item"><div class="dot" style="background: #34d399;"></div> 演算砲台 A & B (各28セル)</div>
      <div class="legend-item"><div class="dot" style="background: #f43f5e;"></div> 遅延リセット砲台 (28セル)</div>
      <div class="legend-item"><div class="dot" style="background: #38bdf8;"></div> 弾丸 A / 同期弾 (青)</div>
      <div class="legend-item"><div class="dot" style="background: #fb923c;"></div> 弾丸 B (オレンジ)</div>
      <div class="legend-item"><div class="dot" style="background: #a3e635;"></div> 結晶化アタッチメント (Q=1記憶)</div>
      <div class="legend-item"><div class="dot" style="background: #facc15;"></div> 衝突スパーク / 完全対消滅</div>
    </div>
  </div>

        boxGroup.remove(boxGroup.children[0]);

      const frameData = FRAMES[stepIndex] || [];
      document.getElementById('time-val').innerText = stepIndex;
      document.getElementById('time-slider').value = stepIndex;

      frameData.forEach(({ type, coord: [x, y, z] }) => {

        mesh.position.set(x, y, z);

      const pFire = document.getElementById('p-fire');
      const pCalc = document.getElementById('p-calc');
      const pStore = document.getElementById('p-store');
      const pReset = document.getElementById('p-reset');

      const statCalc = document.getElementById('stat-calc');
      const statMem = document.getElementById('stat-mem');

        pFire.className = 'pipe-step done';
        pCalc.className = 'pipe-step done';
        pStore.className = 'pipe-step done';
        pReset.className = 'pipe-step active';
        statCalc.innerText = '計算完了 (2)';

    function togglePlay() {

    function prevStep() {
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶ 再生';
      stepIndex = Math.max(0, stepIndex - 1);
      renderStep();
    }

    function nextStep() {
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶ 再生';
      stepIndex = Math.min(80, stepIndex + 1);
      renderStep();
    }

    function resetSim() {
      stepIndex = 0;
      renderStep();
    }

    function onSlider(v) {
      isPlaying = false;
      document.getElementById('play-btn').innerText = '▶ 再生';
      stepIndex = parseInt(v);
      renderStep();
    }

    let lastTime = 0;
    function animate(time) {
      requestAnimationFrame(animate);
      controls.update();

      if (isPlaying && time - lastTime > 160) {
        lastTime = time;
        if (stepIndex < 80) {
          stepIndex++;
          renderStep();
        } else {
          setTimeout(() => {
            if (isPlaying && stepIndex >= 80) {
              stepIndex = 0;
              renderStep();
            }
          }, 2500);
        }
      }

      renderer.render(scene, camera);
    }

    renderStep();
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
