    let currentStep = 0;
    let isPlaying = false;
    let playInterval = null;
    let isGhostMode = false;

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050811, 0.0035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(40, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x050811);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 1.4);
    dirLight1.position.set(60, 80, 60);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xa855f7, 0.9);
    dirLight2.position.set(-60, -40, -60);
    scene.add(dirLight2);

    // Wide Grid along Z axis
    const gridHelper = new THREE.GridHelper(200, 100, 0x1e293b, 0x0f172a);
    gridHelper.position.y = -6;
    scene.add(gridHelper);

    // InstancedMesh (Max 1500 cells)
    const boxGeometry = new THREE.BoxGeometry(0.88, 0.88, 0.88);
    const boxMaterial = new THREE.MeshStandardMaterial({ roughness: 0.2, metalness: 0.35, vertexColors: true });
    const instancedMesh = new THREE.InstancedMesh(boxGeometry, boxMaterial, 1500);
    scene.add(instancedMesh);

    // Ghost Wireframes
    const ghostGroup = new THREE.Group();
    const wireGeo = new THREE.BoxGeometry(0.96, 0.96, 0.96);
    const ghostMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, wireframe: true, transparent: true, opacity: 0.6 });
    for (let i = 0; i < 8; i++) {
      const mesh = new THREE.Mesh(wireGeo, ghostMat);
      ghostGroup.add(mesh);
    }
    ghostGroup.visible = false;
    scene.add(ghostGroup);

    const dummy = new THREE.Object3D();
    const color = new THREE.Color();

    function renderStep() {
      document.getElementById('label-step').textContent = currentStep;
      document.getElementById('stat-step').textContent = currentStep;
      document.getElementById('slider-timeline').value = currentStep;

      const pts = REP_DATA.history[currentStep];
      document.getElementById('stat-cells').textContent = pts.length;

      // Calculate Span along Z
      let minZ = Infinity, maxZ = -Infinity;
      for (const p of pts) {
        if (p[2] < minZ) minZ = p[2];
        if (p[2] > maxZ) maxZ = p[2];
      }
      const span = (pts.length > 0) ? (maxZ - minZ).toFixed(1) : '0.0';
      document.getElementById('stat-span').textContent = span;

      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        dummy.position.set(p[0], p[1], p[2]);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(i, dummy.matrix);

        // Color coding by Z position
        if (pts.length === 8 && [2,4,8,16,32,64].includes(currentStep)) {
          if (p[2] < 1) color.setHex(0x10b981); // Emerald (-Z clone)
          else color.setHex(0x06b6d4); // Cyan (+Z clone)
        } else {
          // Morphing pulse color
          const ratio = (p[2] - minZ) / (maxZ - minZ || 1);
          color.setRGB(0.1 + 0.8 * ratio, 0.4, 0.9 * (1 - ratio) + 0.1);
        }
        instancedMesh.setColorAt(i, color);
      }
      instancedMesh.count = pts.length;
      instancedMesh.instanceMatrix.needsUpdate = true;
      if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;

      // Auto Camera Framing for huge span
      if (span > 30) {
        const targetDist = Math.max(50, span * 1.05);
        if (camera.position.length() < targetDist) {
          camera.position.setLength(targetDist);
        }
      }

      // Update Ghost at t = 2, 4, 8, 16, 32, 64
      if (isGhostMode && [2,4,8,16,32,64].includes(currentStep) && pts.length === 8) {
        ghostGroup.visible = true;
        const c0 = REP_DATA.history[0];
        // Split z-offsets: -2^k, +2^k
        const zOffset = Math.pow(2, Math.round(Math.log2(currentStep)));
        for (let i = 0; i < 4; i++) {
          const p = c0[i];
          const meshA = ghostGroup.children[i];
          meshA.position.set(p[0], p[1], p[2] - zOffset);
          meshA.visible = true;

          const meshB = ghostGroup.children[i + 4];
          meshB.position.set(p[0], p[1], p[2] + zOffset);
          meshB.visible = true;
        }
      } else {
        ghostGroup.visible = false;
      }
    }

    function startPlayback() {
      if (isPlaying) return;
      isPlaying = true;
      document.getElementById('icon-play').classList.add('hidden');
      document.getElementById('icon-pause').classList.remove('hidden');
      playInterval = setInterval(() => {
        if (currentStep < 64) currentStep++;
        else currentStep = 0;
        renderStep();
      }, 250);
    }

    function pausePlayback() {
      isPlaying = false;
      document.getElementById('icon-play').classList.remove('hidden');
      document.getElementById('icon-pause').classList.add('hidden');
      if (playInterval) clearInterval(playInterval);
    }

    document.getElementById('btn-play-pause').addEventListener('click', () => {
      if (isPlaying) pausePlayback();
      else startPlayback();
    });

    document.getElementById('btn-step-prev').addEventListener('click', () => {
      pausePlayback();
      if (currentStep > 0) { currentStep--; renderStep(); }
    });
    document.getElementById('btn-step-next').addEventListener('click', () => {
      pausePlayback();
      if (currentStep < 64) { currentStep++; renderStep(); }
    });

    document.getElementById('slider-timeline').addEventListener('input', (e) => {
      pausePlayback();
      currentStep = parseInt(e.target.value);
      renderStep();
    });

    document.querySelectorAll('.btn-jump').forEach(btn => {
      btn.addEventListener('click', () => {
        pausePlayback();
        currentStep = parseInt(btn.getAttribute('data-step'));
        renderStep();
      });
    });

    document.getElementById('btn-ghost').addEventListener('click', () => {
      isGhostMode = !isGhostMode;
      const btn = document.getElementById('btn-ghost');
      if (isGhostMode) {
        btn.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400');
        document.getElementById('lbl-ghost').textContent = 'ゴーストON';
      } else {
        btn.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400');
        document.getElementById('lbl-ghost').textContent = 'ゴースト照合';
      }
      renderStep();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      camera.position.set(40, 30, 60);
      controls.target.set(1, 1, 1);
      controls.update();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    renderStep();
    animate();
  </script>
</body>
